name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src api tests
      - name: Train model
        run: python -m churn.train
      - name: Test
        run: pytest -q
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: reports/metrics.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t churn-api .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api churn-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
